<text x="500" y="216" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#d8c9ff" text-anchor="middle">loop</text>
<text x="500" y="236" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b7fb0" text-anchor="middle">iterate until clean</text>
